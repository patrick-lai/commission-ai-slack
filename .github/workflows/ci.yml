name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Tests (${{ matrix.os }}, Node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
        node: [20, 24]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - run: node --test
      - run: scripts/build-dist.sh
      - run: npm pack --dry-run --ignore-scripts
      - name: The packaged runtime describes itself
        run: |
          mkdir "$RUNNER_TEMP/unpacked"
          tar -xzf dist/commission-ai-slack-*.tar.gz -C "$RUNNER_TEMP/unpacked"
          "$RUNNER_TEMP/unpacked/commission-ai-slack/bin/commission-ai-slack" version --json | node -e 'const d = JSON.parse(require("node:fs").readFileSync(0, "utf8")); if (d.protocol !== 1 || !/^\d+\.\d+\.\d+/.test(d.version)) { process.exit(1); } console.log(d.version)'
